name: Release

on:
  workflow_dispatch:
    inputs:
      component:
        description: Binary to release. The provider and wcp-watcher are versioned and released independently.
        required: true
        type: choice
        options:
          - provider
          - watcher
      version:
        description: Version number in the pattern x.y.z. Must match the component's crate version on the selected ref.
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  id-token: write
  # Needed for staging
  pull-requests: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version is semver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not valid semver (expected x.y.z)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      # Each component has its own version line, so a provider version entered
      # for the watcher (or the reverse) would publish a binary under a version
      # its crate doesn't carry.
      - name: Validate version matches the component's crate
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$COMPONENT" in
            provider) crate=aws_workload_credentials_provider ;;
            watcher) crate=aws_workload_credentials_provider_watcher ;;
            *) echo "::error::Unknown component '$COMPONENT'"; exit 1 ;;
          esac
          crate_version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
          if [[ -z "$crate_version" ]]; then
            echo "::error::Crate $crate not found in the workspace"
            exit 1
          fi
          if [[ "$crate_version" != "$VERSION" ]]; then
            echo "::error::$crate is at $crate_version on this ref, not $VERSION"
            exit 1
          fi
  staging:
    needs: [validate-version]
    uses: ./.github/workflows/staging.yml
    secrets: inherit
  publish:
    needs: [staging]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Validate required secrets
        env:
          RELEASE_BUCKET: ${{ secrets.RELEASE_BUCKET }}
          RELEASE_WINDOWS_BUCKET: ${{ secrets.RELEASE_WINDOWS_BUCKET }}
          RELEASE_WINDOWS_BIN_PATH: ${{ secrets.RELEASE_WINDOWS_BIN_PATH }}
        run: |
          for var in RELEASE_BUCKET RELEASE_WINDOWS_BUCKET RELEASE_WINDOWS_BIN_PATH; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Required secret $var is empty or unset"
              exit 1
            fi
          done

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aws-wcp-*
          path: artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}
          role-session-name: aws-wcp-release-${{ github.run_id }}
          aws-region: us-west-2

      - name: Upload artifacts to S3
        env:
          RELEASE_BUCKET: ${{ secrets.RELEASE_BUCKET }}
          RELEASE_WINDOWS_BUCKET: ${{ secrets.RELEASE_WINDOWS_BUCKET }}
          RELEASE_WINDOWS_BIN_PATH: ${{ secrets.RELEASE_WINDOWS_BIN_PATH }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          # Each downloaded artifact is a directory named "aws-wcp-<target>"
          # (e.g. artifacts/aws-wcp-x86_64-unknown-linux-gnu/) laid out as
          # staging.yml publishes it:
          #   aws-workload-credentials-provider[.exe]
          #   watcher/wcp-watcher[.exe]
          # Only the selected component is published:
          #   provider: <version>/<target>/aws-workload-credentials-provider[.exe]
          #   watcher:  watcher/<version>/<target>/wcp-watcher[.exe]
          # The watcher has its own key prefix because its versions overlap
          # the provider's numbers without matching its releases.
          #
          # Every target is checked before anything is uploaded: put-object
          # uses --if-none-match, so a release that stopped partway could not
          # be rerun with the same version.
          binary_for() {
            local dir="$1" target="$2"
            if [[ "$COMPONENT" == "provider" ]]; then
              find "$dir" -maxdepth 1 -type f -name 'aws-workload-credentials-provider*'
            elif [[ "$target" == *windows* ]]; then
              echo "${dir}watcher/wcp-watcher.exe"
            else
              echo "${dir}watcher/wcp-watcher"
            fi
          }

          for dir in artifacts/aws-wcp-*/; do
            target="${dir#artifacts/aws-wcp-}"
            target="${target%/}"
            binary=$(binary_for "$dir" "$target")
            count=$(printf '%s' "$binary" | grep -c . || true)
            if [[ "$count" -ne 1 || ! -f "$binary" ]]; then
              echo "::error::Expected exactly one $COMPONENT binary for target $target in $dir"
              exit 1
            fi
          done

          if [[ "$COMPONENT" == "provider" ]]; then
            component_prefix=""
          else
            component_prefix="watcher/"
          fi

          for dir in artifacts/aws-wcp-*/; do
            target="${dir#artifacts/aws-wcp-}"
            target="${target%/}"
            binary=$(binary_for "$dir" "$target")

            # Windows targets go to a separate bucket under a key prefix
            if [[ "$target" == *windows* ]]; then
              bucket="$RELEASE_WINDOWS_BUCKET"
              key_prefix="${RELEASE_WINDOWS_BIN_PATH}/"
            else
              bucket="$RELEASE_BUCKET"
              key_prefix=""
            fi

            aws s3api put-object \
              --bucket "$bucket" \
              --key "${key_prefix}${component_prefix}${VERSION}/${target}/$(basename "$binary")" \
              --body "$binary" \
              --if-none-match "*"
          done
