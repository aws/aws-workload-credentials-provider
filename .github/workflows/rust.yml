name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned so a runner image update can't change the build. Matches staging.yml.
  RUST_TOOLCHAIN: "1.100.0"
  # Rust 1.100 coverage reports most lines as partial or missed, so coverage runs on 1.99.1.
  COVERAGE_TOOLCHAIN: "1.99.1"
  CARGO_LLVM_COV_VERSION: "0.9.2"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: audit

      - name: Checkout 
        uses: actions/checkout@v6
      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: cache-restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Rustup version
        run: rustup --version
      - name: Install Rust toolchains
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c llvm-tools,clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal -c llvm-tools
      - name: Install ninja-build (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - name: Install Go (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install Cargo binaries
        shell: bash
        run: |
          cargo llvm-cov --version | grep -qx "cargo-llvm-cov $CARGO_LLVM_COV_VERSION" \
            || cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked --force
          which cargo-deny || cargo install cargo-deny
      - name: Check licenses
        run: cargo-deny check licenses
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose --all-features --no-fail-fast --workspace --exclude integration-tests
      - name: Code Coverage
        run: cargo +${{ env.COVERAGE_TOOLCHAIN }} llvm-cov --all-features --workspace --exclude integration-tests --codecov --output-path ./codecov.json
      - name: Publish Code Coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./codecov.json
          fail_ci_if_error: true
          use_oidc: true
      - name: Lint
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Cache dependencies
        uses: actions/cache/save@v5
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-llvm-cov-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
