name: Integration Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["main"]
  pull_request_target:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request's code runs with AWS credentials only after a required
  # reviewer of the `integ` environment approves this run.
  authorize:
    name: Approve pull request run
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    environment: integ
    permissions: {}
    concurrency:
      group: integ-approval-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Record the approved commit
      run: echo "Approved integration tests for $HEAD_SHA"
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  integration-tests:
    runs-on: ubuntu-latest
    needs: authorize

    # Starts on every event. On a pull request it fails before any checkout
    # unless a required reviewer approved this run, so a skipped job cannot
    # satisfy the required check.
    if: ${{ !cancelled() }}

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Require approval for pull request runs
      if: ${{ github.event_name == 'pull_request_target' && needs.authorize.result != 'success' }}
      run: |
        echo "::error::Integration tests did not run: approval on the integ environment ended as $AUTHORIZE_RESULT."
        exit 1
      env:
        AUTHORIZE_RESULT: ${{ needs.authorize.result }}

    - name: Harden Runner
      uses: step-security/harden-runner@v2.19.4
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        allow-unsafe-pr-checkout: true
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.ROLE_ARN }}
        role-session-name: aws-workload-credentials-provider-ci-${{ github.run_id }}
        aws-region: us-west-2
    
    - name: Build provider binary
      run: cargo build

    # ubuntu-latest (24.04) denies an unprivileged user namespace its uid/gid
    # maps through AppArmor, and the watcher e2e tests need one to mount the
    # watcher's config directory read-only.
    - name: Allow unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Run integration tests
      env:
        ACM_TEST_ROLE_ARN: ${{ secrets.ACM_TEST_ROLE_ARN }}
        ACM_TEST_CERTIFICATE_ARN: ${{ secrets.ACM_TEST_CERTIFICATE_ARN }}
        # Fail, rather than skip, the tests that need a user and mount namespace.
        WCP_WATCHER_E2E_REQUIRE_MOUNTS: "1"
      run: |
        cd integration-tests
        cargo test -- --test-threads=1
