name: Integration Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["main"]
  pull_request_target:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request's code runs with AWS credentials only after a required
  # reviewer of the `integ` environment approves this run.
  authorize:
    name: Approve pull request run
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    environment: integ
    permissions: {}
    concurrency:
      group: integ-approval-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
    - name: Record the approved commit
      run: echo "Approved integration tests for $HEAD_SHA"
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  integration-tests:
    runs-on: ubuntu-latest
    needs: authorize

    # Run if:
    # 1. Manual trigger, call from another workflow or push to main, OR
    # 2. PR whose run a required reviewer approved
    if: ${{ !cancelled() && (github.event_name != 'pull_request_target' || needs.authorize.result == 'success') }}

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2.19.4
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        allow-unsafe-pr-checkout: true
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.ROLE_ARN }}
        role-session-name: aws-workload-credentials-provider-ci-${{ github.run_id }}
        aws-region: us-west-2
    
    - name: Build provider binary
      run: cargo build
    
    - name: Run integration tests
      env:
        ACM_TEST_ROLE_ARN: ${{ secrets.ACM_TEST_ROLE_ARN }}
        ACM_TEST_CERTIFICATE_ARN: ${{ secrets.ACM_TEST_CERTIFICATE_ARN }}
      run: |
        cd integration-tests
        cargo test -- --test-threads=1
