[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "test-util", "time", "process", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "system-proxy"] }
serde_json = "1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
url = "2"
derive_builder = "0.20"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dunce = "1.0"
# Local TLS listeners for discovery.rs.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
rustls = "0.23"
tokio-rustls = "0.26"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
# unshare(2) and mount(2) for provider_watcher.rs.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
aws_certificatemanager_provider = { path = "../aws_certificatemanager_provider" }

