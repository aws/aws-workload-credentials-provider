[package]
name = "aws_certificatemanager_provider"
version = "3.2.0"
edition = "2021"
license = "Apache-2.0"
description = "AWS ACM certificate management for the AWS Workload Credentials Provider."
homepage = "https://github.com/aws/aws-workload-credentials-provider"
repository = "https://github.com/aws/aws-workload-credentials-provider"
readme = "../README.md"

[features]
fips = ["aws-lc-rs/fips", "aws_certificatemanager_discovery/fips", "rustls/fips"]

[dependencies]
aws_certificatemanager_discovery = { version = "3.1.1", path = "../aws_certificatemanager_discovery" }
aws-sdk-acm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
rustls = { version = "0.23", default-features = false }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "process", "time", "signal"] }
aws-lc-rs = "1"
zeroize = "1"
thiserror = "2"
base64ct = { version = "1", features = ["alloc"] }
log = "0.4.29"
tokio-util = "0.7.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
aws_workload_credentials_provider_common = { version = "3.2.0", path = "../aws_workload_credentials_provider_common" }
# We are required to use the sha1 feature to decrypt the password protected private keys.
pkcs8 = { version = "0.10", features = ["encryption", "pem", "sha1-insecure"] }
pkcs5 = "0.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
aws-smithy-mocks = "0.1"
aws-smithy-runtime = { version = "1", features = ["test-util"] }
aws-sdk-acm = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "test-util"] }
http = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "test-util"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }
